<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security" lang="nl">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Nieuwe wedstrijd</title>

</head>
<body>

<!-- NAV FRAGMENT (login/logout staat nu op elke pagina waar dit fragment gebruikt wordt) -->
<div th:replace="~{fragments/nav :: topnav}"></div>
<div class="hoofd">
    <h1 th:text="#{nieuweWedstrijd}"></h1>
</div>


<div class="card">
    <form th:action="@{/wedstrijd/nieuw}" method="post" th:object="${form}">
        <div class="row">
            <label for="land1" th:text="#{land1}"></label>
            <input id="land1" type="text" th:field="*{land1}" required>
            <span class="error" th:if="${#fields.hasErrors('land1')}" th:errors="*{land1}"></span>
        </div>

        <div class="row">
            <label for="land2" th:text="#{land2}"></label>
            <input id="land2" type="text"  th:field="*{land2}" required>
            <span class="error" th:if="${#fields.hasErrors('land2')}" th:errors="*{land2}"></span>
        </div>

        <div class="row">
            <label for="speeldatum" th:text="#{speeldatum}"></label>
            <input id="speeldatum" type="date" th:field="*{speeldatum}" required>
            <span class="error" th:if="${#fields.hasErrors('speeldatum')}" th:errors="*{speeldatum}"></span>
        </div>

        <div class="row">
            <label for="starttijd" th:text="#{starttijd}"></label>
            <input id="starttijd" type="time" th:field="*{starttijd}" required>
            <span class="error" th:if="${#fields.hasErrors('starttijd')}" th:errors="*{starttijd}"></span>
        </div>

        <div class="row">
            <label for="locatieId" th:text="#{locatie}"></label>
            <select id="locatieId" th:field="*{locatieId}" required>
                <option value="" disabled selected th:text="#{kiesLocatie}"></option>
                <option th:each="l : ${locaties}"
                        th:value="${l.id}"
                        th:text="|${l.stad} (${l.stadion})|">
                </option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('locatieId')}" th:errors="*{locatieId}"></span>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button class="btn" type="submit" th:text="#{wedstrijdAanmaken}"></button>
    </form>
</div>
<!-- Popup Bevestiging na aanmaken nieuwe wedstrijd -->


</body>
</html>
