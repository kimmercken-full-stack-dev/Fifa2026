<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Mijn teams</title>
</head>
<body>
<!-- NAV FRAGMENT (login/logout staat nu op elke pagina waar dit fragment gebruikt wordt) -->
<div th:replace="~{fragments/nav :: topnav}"></div>
<div class="hoofd">
    <h1 th:text="#{mijnTeams}"></h1>
</div>

<table aria-label="Mijn teams overzicht">
    <thead>
    <tr>

        <th th:text="#{teamnaam}"></th>
        <th th:text="#{eigenaar}"></th>
        <th th:text="#{teamTotaleScore}"></th>
        <th th:text="#{acties}"></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="team : ${teams}">

        <td th:text="${team.teamNaam}"></td>
        <td th:text="${team.eigenaar != null ? team.eigenaar.username : '-'}"></td>
        <td th:text="${team.score}"></td>
        <td>
            <div class="actions">

                <a class="btn-bekijk"
                   th:href="@{/teams/{id}(id=${team.teamID})}"
                   th:text="#{bekijkTeam}">
                </a>

                <!-- Enkel eigenaar mag verwijderen -->
                <form th:if="${team.eigenaar != null and team.eigenaar.username == #authentication.name}"
                      th:action="@{|/teams/${team.teamID}/delete|}"
                      method="post"
                      style="display:inline-flex; margin:0;">

                    <button class="btn-danger"
                            type="submit"
                            onclick="return confirm('Ben je zeker dat je dit team wilt verwijderen?');">
                        Verwijderen
                    </button>

                </form>

            </div>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${teams == null || #lists.isEmpty(teams)}" th:text="#{nogGeenLidVanEenTeam}"></p>

<div class="card-row">
    <!-- LINKS: nieuw team aanmaken -->
    <div class="card">
        <h3 th:text="#{nieuwTeam}"></h3>

        <p class="error" th:if="${createError}" th:text="${createError}"></p>

        <form th:action="@{/teams/nieuw}" method="post"
              style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
            <input type="text" name="teamNaam" placeholder="Teamnaam" required />
            <button class="btn" type="submit" th:text="#{maakNieuwTeam}"></button>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </form>

        <p class="muted" th:text="#{infoAanmakenNieuwTeam}"></p>
    </div>

    <!-- RECHTS: aansluiten via invitecode (jouw bestaande card) -->
    <div class="card">
        <h3 th:text="#{aansluitenMetInvitecode}"></h3>

        <p class="error" th:if="${joinError}" th:text="${joinError}"></p>

        <form th:action="@{/teams/join}" method="post"
              style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
            <input type="number" name="code" placeholder="8-cijferige code" required />
            <button class="btn" type="submit">Join team</button>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </form>

        <p class="muted" th:text="#{naJoin}"></p>
    </div>
</div>

</body>
</html>
