spring.application.name=FIFA_2026
spring.config.import=optional:file:./config/application-local.properties
app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fifa2026_demo?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
# Alleen het expliciet gekozen dev-profiel maakt de demotabellen opnieuw aan.
spring.jpa.hibernate.ddl-auto=validate

# Batchopslag van herberekende scores.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true
